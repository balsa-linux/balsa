[hardware]
arch = "x86_64-linux"
cpu = "intel"
gpu = ["nvidia-proprietary"]
firmware = "auto"

[network]
hostname = "standard-plasma-btrfs-encrypted"
backend = "network-manager"

[kernel]
type = "default"


