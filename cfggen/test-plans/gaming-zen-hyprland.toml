desktop = "hyprland"
tuning_profile = "gaming"

[locale]
locale = "en_US.UTF-8"
keymap = "us"
timezone = "America/New_York"

[disk]
disk = "/dev/vda"
filesystem = "btrfs"

[disk.scheme]
type = "guided"

[disk.swap]
type = "partition"
size_gib = 16

[boot]
legacy_bios = false

[hardware]
arch = "x86_64-linux"
cpu = "intel"
gpu = ["nvidia-open"]
firmware = "all"

[network]
hostname = "gaming-zen-hyprland"
backend = "network-manager"

[kernel]
type = "zen"


[accounts]
root_enabled = false

