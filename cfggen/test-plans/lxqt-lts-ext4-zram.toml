desktop = "lxqt"
tuning_profile = "lightweight"

[locale]
locale = "en_US.UTF-8"
keymap = "us"
timezone = "America/New_York"

[disk]
disk = "/dev/vda"
filesystem = "ext4"

[disk.scheme]
type = "guided"

[disk.swap]
type = "zram"

[boot]
loader = "systemd-boot"
dual_boot = false
legacy_bios = false

[hardware]
arch = "x86_64-linux"
cpu = "intel"
gpu = ["intel"]
firmware = "auto"

[network]
hostname = "lxqt-lts-ext4-zram"
backend = "network-manager"

[kernel]
type = "lts"


[accounts]
root_enabled = false

