desktop = "niri"
tuning_profile = "gaming"

[locale]
locale = "en_US.UTF-8"
keymap = "us"
timezone = "America/New_York"

[disk]
disk = "/dev/vda"
filesystem = "btrfs"

[disk.encryption]
luks_name = "cryptroot"

[disk.scheme]
type = "guided"

[disk.swap]
type = "zram"

[boot]
legacy_bios = false

[hardware]
arch = "x86_64-linux"
cpu = "amd"
gpu = ["amd"]
firmware = "auto"

[network]
hostname = "niri-default-btrfs-encrypted"
backend = "network-manager"

[kernel]
type = "default"


[accounts]
root_enabled = false

