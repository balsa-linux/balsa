desktop = "plasma"
tuning_profile = "standard"

[locale]
locale = "en_US.UTF-8"
keymap = "us"
timezone = "America/New_York"

[disk]
disk = "/dev/vda"
filesystem = "ext4"

[disk.scheme]
type = "manual"
devices = """
    disk.main = {
      device = "/dev/vda";
      type = "disk";
      content = {
        type = "gpt";
        partitions = {
          ESP = {
            size = "1G";
            type = "EF00";
            content = {
              type = "filesystem";
              format = "vfat";
              mountpoint = "/boot";
              mountOptions = [ "umask=0077" ];
            };
          };
          root = {
            size = "100%";
            content = {
              type = "filesystem";
              format = "ext4";
              mountpoint = "/";
            };
          };
        };
      };
    };
"""

[disk.swap]
type = "none"

[boot]
loader = "systemd-boot"
dual_boot = false
legacy_bios = false

[hardware]
arch = "x86_64-linux"
cpu = "intel"
gpu = ["intel"]
firmware = "auto"

[network]
hostname = "plasma-manual-scheme-ext4"
backend = "network-manager"

[kernel]
type = "default"


[accounts]
root_enabled = false

