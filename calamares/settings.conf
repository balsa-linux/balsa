---

# "local" misses balsa's jobs: default.nix fills in the placeholder, calamares/modules serves checkout runs.
modules-search:
- local
- "@modulesDir@"
- calamares/modules

instances:
- id: kernel
  module: packagechooser
  config: packagechooser_kernel.conf

- id: desktop
  module: packagechooser
  config: packagechooser_desktop.conf

- id: loginmanager
  module: packagechooser
  config: packagechooser_loginmanager.conf

- id: tuning
  module: packagechooser
  config: packagechooser_tuning.conf

- id: tuningextra
  module: packagechooser
  config: packagechooser_tuningextra.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@kernel
  - partition
  - packagechooser@desktop
  - packagechooser@loginmanager
  - users
  - packagechooser@tuning
  - packagechooser@tuningextra
  - summary

- exec:
  # partition only fills globalstorage["partitions"] from its exec job; disko then replaces its layout.
  - partition
  - balsa-hardware-detect
  - balsa-disko
  - balsa-apply
  - balsa-config-export
  # No stock umount: balsa-install unmounts (and exports ZFS) itself, and umount fails if already unmounted.
  - balsa-install

- show:
  - finished

branding: balsa

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
