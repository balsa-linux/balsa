---
defaultGroups:
    - name: users
    - name: networkmanager
    - name: video
    - name: audio
    - name: wheel

autologinGroup: autologin
doAutologin: false

sudoersGroup: wheel

# No separate root password reaches globalstorage, so root stays locked and the user gets wheel.
setRootPassword: false
doReusePassword: false

passwordRequirements:
    nonempty: true
    minLength: 8

# /bin/bash does not exist on NixOS.
user:
    shell: /run/current-system/sw/bin/bash

# etcfile makes the users page publish "hostname" to globalstorage; nothing writes /etc/hostname.
hostname:
    location: etcfile
    writeHostsFile: false
    # Suggestion only; the user can type over it.
    template: "balsa"
