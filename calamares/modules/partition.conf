---
# Overrides the calamares-nixos-extensions default (ext4, no zfs).
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 260MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks2

defaultFileSystemType: "btrfs"

# zfs is listed for the manual path; the erase path goes through disko.
availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs
    - zfs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
