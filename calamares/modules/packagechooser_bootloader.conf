labels:
    step: "Bootloader"
    # reason: "Choose what boots the installed system."  # unread by 3.4.2; kept for a C++ screen

items:
- id: "auto"
  name: "Automatic (recommended)"
  description: "systemd-boot on UEFI, GRUB on legacy BIOS."

- id: "systemd-boot"
  name: "systemd-boot"
  description: "Small UEFI-only loader. Falls back to GRUB on legacy BIOS."

- id: "grub"
  name: "GRUB"
  description: "Boots UEFI and legacy BIOS, and is the only one that detects other installed systems."

- id: "limine"
  name: "Limine (btrfs only)"
  description: "Boots btrfs snapshots directly. Falls back to the automatic choice on other filesystems."
